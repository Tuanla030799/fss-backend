# Legacy VM deployment. The API now uses MongoDB (MONGODB_URI); the PostgreSQL service is kept only so the
# existing backup/restore scripts and the PostgreSQL -> MongoDB migration can read the old data.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fss_internal
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      MONGODB_URI: ${MONGODB_URI}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_ACCESS_TOKEN_MINUTES: ${APP_JWT_ACCESS_TOKEN_MINUTES:-30}
      APP_JWT_REFRESH_TOKEN_DAYS: ${APP_JWT_REFRESH_TOKEN_DAYS:-30}
      APP_UPLOAD_DIR: ${APP_UPLOAD_DIR:-/app/uploads}
      APP_CDN_BASE_URL: ${APP_CDN_BASE_URL}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_AUTH_ALLOW_PUBLIC_ADMIN_REGISTRATION: ${APP_AUTH_ALLOW_PUBLIC_ADMIN_REGISTRATION:-false}
      LOGGING_FILE_PATH: ${LOGGING_FILE_PATH:-/app/logs}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    expose:
      - "8080"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      fss_internal:
      public_proxy:
        aliases:
          - backend

volumes:
  postgres_data:

networks:
  fss_internal:
  public_proxy:
    name: ${BACKEND_PUBLIC_NETWORK:-thepocketshoes_net}
    external: true
