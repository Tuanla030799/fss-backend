services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fss
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fss"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_CDN_BASE_URL: ${APP_CDN_BASE_URL:-/files}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      APP_AUTH_ALLOW_PUBLIC_ADMIN_REGISTRATION: ${APP_AUTH_ALLOW_PUBLIC_ADMIN_REGISTRATION:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs

volumes:
  postgres_data:
