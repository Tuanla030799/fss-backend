plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.fss'
version = '1.0.0'

bootJar {
    archiveFileName = 'app.jar'
}

// Heroku runs `./gradlew stage` when the task exists; only the executable jar is needed.
jar {
    enabled = false
}

tasks.register('stage') {
    dependsOn tasks.named('bootJar')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext {
    jjwtVersion = '0.12.6'
    awsSdkVersion = '2.31.78'
    twelveMonkeysVersion = '3.12.0'
    metadataExtractorVersion = '2.19.0'
}

// MongoDB Java driver 5.0 (Boot 3.3 default) predates MongoDB 8.0 servers used by Atlas.
ext['mongodb.version'] = '5.5.1'
// Docker Engine 29 requires Testcontainers >= 1.21.4.
ext['testcontainers.version'] = '1.21.4'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    implementation 'org.springframework.security:spring-security-crypto'

    // Cloudflare R2 via the S3-compatible API. The JDK HTTP client avoids Netty/Apache memory overhead.
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation('software.amazon.awssdk:s3') {
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
    }
    implementation 'software.amazon.awssdk:url-connection-client'

    // Pure-Java image codecs/metadata (no native libraries on Heroku).
    implementation "com.twelvemonkeys.imageio:imageio-jpeg:${twelveMonkeysVersion}"
    implementation "com.twelvemonkeys.imageio:imageio-webp:${twelveMonkeysVersion}"
    implementation "com.drewnoakes:metadata-extractor:${metadataExtractorVersion}"

    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mongodb'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation(project(':migration-tool')) {
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}
