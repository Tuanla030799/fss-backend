# Heroku profile (SPRING_PROFILES_ACTIVE=heroku). Every secret comes from Config Vars; missing values fail the boot.
spring.data.mongodb.uri=${MONGODB_URI}
app.jwt.secret=${APP_JWT_SECRET}
app.security.require-strong-jwt-secret=true
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.auth.allow-public-admin-registration=false

# Images must be durable: R2 only.
app.storage.provider=${STORAGE_PROVIDER:r2}

# 512 MB dyno: few Tomcat threads (each has a stack) and a small MongoDB pool (Atlas M0 allows 500 connections).
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:32}
server.tomcat.threads.min-spare=4
server.tomcat.accept-count=100
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

app.storage.allow-local=false
