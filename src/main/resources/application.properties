spring.application.name=fss-backend
logging.file.path=./logs
logging.level.root=INFO
logging.level.com.fss.backend=INFO
logging.level.org.springframework=INFO
logging.level.org.mybatis=INFO

# Local/default profile
spring.datasource.url=jdbc:postgresql://localhost:5432/fss
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=2500
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=20000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

mybatis.mapper-locations=classpath*:mappers/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-statement-timeout=3

server.port=8080

app.jwt.secret=super-secret-change-me-super-secret-change-me
app.jwt.access-token-minutes=30
app.jwt.refresh-token-days=30
app.upload-dir=./uploads
app.cdn.base-url=/files
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173

management.endpoints.web.exposure.include=health,metrics,prometheus

# Conditional image resize for local uploads. Small images are kept as-is.
app.image.resize.max-width=1600
app.image.resize.max-height=1600
app.image.resize.min-bytes=512000
