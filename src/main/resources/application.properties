spring.application.name=fss-backend
logging.file.path=./logs
logging.level.root=INFO
logging.level.com.fss.backend=INFO
logging.level.org.springframework=INFO
logging.level.org.mongodb.driver=WARN

# ---------------------------------------------------------------- MongoDB
# Local default: docker compose single-node replica set (transactions need a replica set).
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/fss?replicaSet=rs0&directConnection=true}
spring.data.mongodb.database=${MONGODB_DATABASE:fss}
# UUIDs are stored as BSON binary subtype 4 (the portable standard representation).
spring.data.mongodb.uuid-representation=standard
spring.data.mongodb.auto-index-creation=false
app.mongodb.ensure-indexes=${APP_MONGODB_ENSURE_INDEXES:true}
app.mongodb.require-transactions=true
app.mongodb.transaction-max-attempts=10

# ---------------------------------------------------------------- HTTP
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.servlet.multipart.max-file-size=${APP_UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${APP_UPLOAD_MAX_REQUEST_SIZE:11MB}

# ---------------------------------------------------------------- Security
# Development-only defaults. The heroku profile requires real values from the environment.
app.jwt.secret=${APP_JWT_SECRET:super-secret-change-me-super-secret-change-me}
app.jwt.access-token-minutes=${APP_JWT_ACCESS_TOKEN_MINUTES:30}
app.jwt.refresh-token-days=${APP_JWT_REFRESH_TOKEN_DAYS:30}
app.security.require-strong-jwt-secret=false
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
app.auth.allow-public-admin-registration=${APP_AUTH_ALLOW_PUBLIC_ADMIN_REGISTRATION:true}
# Refresh token cookie (HttpOnly, Path=/api/admin/auth). Chrome and Firefox accept Secure cookies on http://localhost.
app.auth.refresh-cookie.secure=${APP_AUTH_REFRESH_COOKIE_SECURE:true}
# Strict works while the admin app and the API share a site (thepocketshoes.store / api.thepocketshoes.store).
# Use None (requires Secure) only when the admin app is served from another site.
app.auth.refresh-cookie.same-site=${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Strict}
app.time-zone=Asia/Ho_Chi_Minh
app.seed.master-data=${APP_SEED_MASTER_DATA:true}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

# Only the health endpoint is exposed (no metrics/env/heap dumps), without details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# ---------------------------------------------------------------- Files / images
# local (development, legacy VM) or r2 (Heroku). Heroku's filesystem is ephemeral: never use local there.
app.storage.provider=${STORAGE_PROVIDER:local}
app.upload-dir=${APP_UPLOAD_DIR:./uploads}
# Public base URL for files. Empty = /files (local) or R2_PUBLIC_BASE_URL + /files (r2).
app.cdn.base-url=${APP_CDN_BASE_URL:}
app.storage.r2.endpoint=${R2_ENDPOINT:}
app.storage.r2.bucket=${R2_BUCKET:}
app.storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.storage.r2.public-base-url=${R2_PUBLIC_BASE_URL:}
# Extra hosts whose /files/<path> images are accepted in HTML content (e.g. the old domain).
app.content.allowed-image-hosts=${APP_CONTENT_ALLOWED_IMAGE_HOSTS:localhost,127.0.0.1}

# Images keep aspect ratio, are never upscaled and are bounded to 1600x1600.
app.image.resize.max-width=${APP_IMAGE_MAX_WIDTH:1600}
app.image.resize.max-height=${APP_IMAGE_MAX_HEIGHT:1600}
app.image.jpeg-quality=${APP_IMAGE_JPEG_QUALITY:0.85}
# Reject decompression bombs before decoding pixel data.
app.image.max-pixels=${APP_IMAGE_MAX_PIXELS:40000000}
# Concurrent decodes; each can take tens of MB of heap regardless of the compressed size.
app.image.max-concurrent=${APP_IMAGE_MAX_CONCURRENT:2}
app.image.acquire-timeout-ms=20000

# Unused (INACTIVE) uploads are deleted after this delay; long enough for an admin to finish editing.
app.file-cleanup.inactive-ttl=${APP_FILE_CLEANUP_INACTIVE_TTL:PT24H}
app.file-cleanup.uploading-ttl=PT1H
app.file-cleanup.lease=PT10M
app.file-cleanup.fixed-delay-ms=${APP_FILE_CLEANUP_FIXED_DELAY_MS:300000}
app.file-cleanup.batch-size=50
