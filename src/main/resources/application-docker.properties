# Docker profile overrides
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/fss}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
logging.file.path=${LOGGING_FILE_PATH:/app/logs}
app.upload-dir=${APP_UPLOAD_DIR:/app/uploads}
app.cdn.base-url=${APP_CDN_BASE_URL:/files}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.auth.allow-public-admin-registration=${APP_AUTH_ALLOW_PUBLIC_ADMIN_REGISTRATION:false}
