pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'fss-backend'

// One-off PostgreSQL -> MongoDB / uploads -> R2 migration CLI. Not part of the deployed jar.
include 'migration-tool'
