name: CI

# Build and test only. This workflow never deploys.
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test (Testcontainers MongoDB/PostgreSQL)
        run: ./gradlew --no-daemon test
      - name: Build Heroku artifact
        run: ./gradlew --no-daemon stage
